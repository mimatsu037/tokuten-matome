<!-- カード一覧 -->

  <p id="noResult" class="hidden text-center text-sm text-brand-dark/50 py-16">
    😥 該当する特典が見つかりませんでした。<br>別のキーワードで試してみてね。

<script>
  const items = [
    { img: "assets/banner-jp-photo-sticker-guide.png", title: "日本の日常写真で稼ぐ📷✨AIデジタルステッカー販売ガイド", desc: "スマホの中の日常写真をAIでデジタルステッカーに変えて海外販売する方法。", url: "https://mimatsu037.github.io/jp-photo-sticker-guide/" },
    { img: "assets/banner-digital-paper-guide.png", title: "柄ひとつで長く売れる📄✨AIデジタルペーパー販売ガイド", desc: "AIで作った柄をデジタルペーパーとして海外に販売する方法。", url: "https://mimatsu037.github.io/digital-paper-guide/" },
    { img: "assets/banner-ai-puzzle-openchat.png", title: "AIパズル販売スタートガイド", desc: "在庫ゼロ・発送ゼロで始めるAIパズル販売。コピペOKプロンプト付き。", url: "https://mimatsu037.github.io/ai-puzzle-openchat/" },
    { img: "assets/banner-ai-nurie-openchat.png", title: "AIぬりえ本 販売ガイド", desc: "在庫リスク0でAmazonに並べるAIぬりえ本の作り方。コピペOKプロンプト付き。", url: "https://mimatsu037.github.io/ai-nurie-openchat/" },
    { img: "assets/banner-ai-ehon-openchat.png", title: "AI絵本のはじめ方ガイド", desc: "AIでオリジナル絵本を作って販売する、はじめの一歩。コピペOKプロンプト付き。", url: "https://mimatsu037.github.io/ai-ehon-openchat/" },
    { img: "assets/banner-ai-fukugyo3sen-openchat.png", title: "知る人ぞ知る…AIでできる穴場の在宅副業3選", desc: "まだ知られていない、AIを使った在宅副業のアイデアを3つ紹介。", url: "https://mimatsu037.github.io/ai-fukugyo3sen-openchat/" },
    { img: "assets/banner-ai-ranking-openchat.png", title: "複業で使うべきAIツールランキング", desc: "実際に使って良かったAIツールを、用途別にランキング形式で紹介。", url: "https://mimatsu037.github.io/ai-ranking-openchat/" },
    { img: "assets/banner-ai-daihonsakusei-openchat.png", title: "AI×台本作成の手順書【クラウドワークス】", desc: "クラウドワークスで受注できる、AIを使った台本作成の実践手順。", url: "https://mimatsu037.github.io/ai-daihonsakusei-openchat/" },
    { img: "assets/banner-substack-note-openchat.png", title: "noteのネタが尽きないSubstack活用ガイド", desc: "海外プラットフォームSubstackを使って、noteのネタ切れを解消する方法。コピペOKプロンプト付き。", url: "https://mimatsu037.github.io/substack-note-openchat/" },
    { img: "assets/banner-instagram-note-openchat.png", title: "ChatGPT×Instagram×note 収益化完全プロンプト5選", desc: "InstagramとnoteをChatGPTで連携させる収益化プロンプトをまとめて紹介。", url: "https://mimatsu037.github.io/instagram-note-openchat/" },
    { img: "assets/banner-claude-note-openchat.png", title: "Claude×note記事作成プロンプト＋note必須設定5選", desc: "Claudeでnote記事を効率よく書くプロンプトと、必須の初期設定。", url: "https://mimatsu037.github.io/claude-note-openchat/" },
    { img: "assets/banner-claude-rakuten-openchat.jpg", title: "Claude×楽天アフィリエイト 自動化セットアップガイド", desc: "Claudeを使って楽天アフィリエイト記事の作成を自動化するセットアップ手順。", url: "https://mimatsu037.github.io/claude-rakuten-openchat/" },
    { img: "assets/banner-googlemap-openchat.png", title: "AI×Googleマップで叶える「未経験からのWeb制作」スタートマニュアル", desc: "未経験からでも始められる、AI×GoogleマップのWeb制作案件の入り方。", url: "https://mimatsu037.github.io/googlemap-openchat/" },
    { img: "assets/banner-ai-pinterest-openchat.png", title: "AI×Pinterest入門ガイド", desc: "AIがあなたの代わりに働く仕組みの作り方。初心者ママでもできるPinterest活用法。", url: "https://mimatsu037.github.io/ai-pinterest-openchat/" },
    { img: "assets/banner-japanese-work-openchat.png", title: "日本語を整えるだけ。おうち時間を収入に変える新しい働き方", desc: "特別なスキル不要、日本語を整えるだけでできる新しい在宅ワーク。", url: "https://mimatsu037.github.io/japanese-work-openchat/" },
    { img: "assets/banner-japanese-openchat.png", title: "日本語×AIで時給UPガイド", desc: "日本語の強みとAIを掛け合わせて、時給を上げる働き方ガイド。", url: "https://mimatsu037.github.io/japanese-openchat/" },
    { img: "assets/banner-fiverr-honyaku-openchat.png", title: "Fiverr×AI翻訳ワーク", desc: "寝かしつけ後の30分を収入に変える、Fiverrを使ったAI翻訳ワークの始め方。", url: "https://mimatsu037.github.io/fiverr-honyaku-openchat/" },
    { img: "assets/banner-line-stamp-openchat.png", title: "LINEスタンプ販売スタートガイド", desc: "AIを使ってLINEスタンプを作り、販売するまでの流れをまとめたガイド。", url: "https://mimatsu037.github.io/line-stamp-openchat/" },
    { img: "assets/banner-line-emoji-openchat.png", title: "チャッピーでLINE絵文字販売スタートガイド", desc: "ChatGPT（チャッピー）を使ってLINE絵文字を作り、販売するスタートガイド。", url: "https://mimatsu037.github.io/line-emoji-openchat/" },
    { img: "assets/banner-japanese-poster-openchat.png", title: "日本風ポスター販売スタートガイド", desc: "AIで日本風のアートポスターを作り、海外向けに販売するガイド。", url: "https://mimatsu037.github.io/japanese-poster-openchat/" },
  ];

  const listEl = document.getElementById('cardList');
  const noResultEl = document.getElementById('noResult');
  const countEl = document.getElementById('resultCount');
  const searchBox = document.getElementById('searchBox');
  const clearBtn = document.getElementById('clearBtn');

  function renderCards() {
    listEl.innerHTML = items.map((item, i) => `
      <a href="${item.url}" target="_blank" rel="noopener" data-idx="${i}"
        class="card-item block bg-white rounded-2xl overflow-hidden shadow-sm border border-brand-coral/10 hover:shadow-md hover:border-brand-coral/30 transition">
        <img src="${item.img}" alt="${item.title}" class="w-full aspect-video object-cover bg-brand-peach">
        <div class="flex items-center justify-between gap-3 px-4 py-3">
          <p class="text-sm font-bold text-brand-deep">タップして受け取る▷▶︎▷</p>
          <span class="text-brand-deep text-lg flex-shrink-0">›</span>
        </div>
      </a>
    `).join('');
    updateCount(items.length);
  }

  function updateCount(n) {
    countEl.textContent = n + '件の特典';
  }

  function normalize(str) {
    return str.toLowerCase();
  }

  function filterCards() {
    const q = normalize(searchBox.value.trim());
    clearBtn.classList.toggle('hidden', q.length === 0);
    let visible = 0;
    document.querySelectorAll('.card-item').forEach(el => {
      const item = items[el.dataset.idx];
      const hay = normalize(item.title + ' ' + item.desc);
      const match = q === '' || hay.includes(q);
      el.classList.toggle('card-hidden', !match);
      if (match) visible++;
    });
    updateCount(visible);
    noResultEl.classList.toggle('hidden', visible !== 0);
  }

  function clearSearch() {
    searchBox.value = '';
    filterCards();
    searchBox.focus();
  }

  searchBox.addEventListener('input', filterCards);
  renderCards();
</script>

</body>
</html>
